name: verify-bpf-generated-code

on:
  pull_request:
    paths:
      # Any C source or header in bpf/ can change the generated objects — a
      # new #include lands without touching the .c file's own path, so an
      # enumerated file list is always one forgotten header away from letting
      # a drifted object through.
      - "bpf/*.c"
      - "bpf/*.h"
      # cargowall.go holds the bpf2go go:generate directives themselves.
      - "cargowall.go"
      # A toolchain or dependency bump regenerates the bpf2go loaders and can
      # recompile the objects — re-verify them from the pinned CI environment
      # rather than trusting whatever local clang produced the commit.
      - "go.mod"
      - ".github/workflows/bpf-generate.yml"



jobs:
  verify:
    name: Verify generated files
    # Pinned, not ubuntu-latest: this job compares generated objects
    # BYTE-FOR-BYTE, so the image rolling to a new Ubuntu (and a new default
    # clang) would fail every open PR at once with a diff no author caused.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Pin the COMPILER, not just the distro. `apt-get install clang` installs
      # a metapackage, and the runner image already ships several LLVM
      # toolchains — so `clang` on PATH is whichever one the image happens to
      # prefer, not the one apt just set up. That is how this job came to
      # reject an object that regenerates byte-for-byte on stock Ubuntu 24.04
      # clang 18.1.3: same source, same flags, a different compiler.
      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libbpf-dev
          mkdir -p "$HOME/bpf-toolchain"
          ln -sf /usr/bin/clang-18 "$HOME/bpf-toolchain/clang"
          ln -sf /usr/bin/llvm-strip-18 "$HOME/bpf-toolchain/llvm-strip"
          echo "$HOME/bpf-toolchain" >> "$GITHUB_PATH"

      - name: Record the toolchain
        run: |
          # Printed unconditionally: when the checksums disagree, the FIRST
          # question is which compiler produced them, and reading that out of
          # an apt transcript is guesswork.
          echo "clang:      $(command -v clang) -> $(clang --version | head -1)"
          echo "llvm-strip: $(command -v llvm-strip) -> $(llvm-strip --version | head -2 | tail -1)"

      - name: Checksum existing BPF objects
        run: |
          mkdir -p /tmp/bpf-committed
          cp bpf/*.o /tmp/bpf-committed/
          find bpf -name '*.o' -exec sha256sum {} \; | sort > /tmp/bpf-objects-before.txt

      - name: Run go generate
        run: go generate ./...

      - name: Check for uncommitted changes
        run: |
          # Generated .go files are plain text and compare exactly.
          go_changed=$(git diff --name-only -- '*.go')

          # Objects compare on what they DO, not on their bytes. clang emits
          # the .BTF string table in an order that is not stable across hosts:
          # two compiles of identical sources, both on Ubuntu 24.04 clang
          # 18.1.3, differed only by `bpf_sock` and `bpf_flow_keys` swapping
          # places in that table plus the three name offsets that shift with
          # them — bytecode, relocations, symbols and .BTF.ext byte-identical.
          # A checksum comparison fails that non-reproducibly, and it fails on
          # a difference that cannot change behaviour. Disassembly plus section,
          # symbol and relocation tables covers every difference that can.
          # Two descriptors, because neither alone is enough.
          #
          # The ELF half covers bytecode, relocations, symbols and section
          # sizes. The path is normalised out: objdump prints it as the first
          # line of its own output, and the two copies being compared live at
          # different paths, so without this EVERY object differs.
          #
          # The SPEC half covers map and program definitions, which live in
          # .BTF — the section the ELF half must skip, because clang's string
          # ordering there is not stable across hosts. Without it the check is
          # blind to anything BTF-only: `max_entries` can change with no effect
          # on disassembly, section sizes, symbols or relocations, and a stale
          # object then compares equal while silently rejecting writes to a key
          # the new one accepts.
          objdesc() {
            { llvm-objdump-18 -d --no-show-raw-insn "$1"
              llvm-readelf-18 --section-headers --symbols --relocations "$1"
            } | sed "s|$1|OBJ|g"
            go run ./scripts/ci/bpfspec "$1"
          }

          o_changed=""
          for obj in bpf/*.o; do
            committed="/tmp/bpf-committed/$(basename "$obj")"
            if ! diff -q <(objdesc "$committed") <(objdesc "$obj") > /dev/null; then
              o_changed="$o_changed $obj"
            fi
          done

          if [ -n "$go_changed" ] || [ -n "$o_changed" ]; then
            echo "::error::Generated files are out of date. Run 'go generate ./...' and commit the changes (clang 18 on Ubuntu 24.04 — see the toolchain printed above)."
            [ -n "$go_changed" ] && echo "Changed Go files:" && echo "$go_changed"
            [ -n "$o_changed" ] && echo "Changed BPF objects:" && echo "$o_changed"
            exit 1
          fi

          # Byte drift with identical behaviour is worth SEEING — it is how
          # this check learned about the BTF string ordering — but it is not
          # worth failing a PR over.
          find bpf -name '*.o' -exec sha256sum {} \; | sort > /tmp/bpf-objects-after.txt
          if ! diff -q /tmp/bpf-objects-before.txt /tmp/bpf-objects-after.txt > /dev/null; then
            echo "::notice::Objects are functionally identical but not byte-identical (expected: clang's .BTF string order is host-dependent)."
          fi
          echo "Generated files are up to date."

      # On a mismatch the checksums say THAT the objects differ and nothing
      # about HOW, which is the only question worth asking: a codegen
      # difference and a stale commit look identical from a hash. Keeping both
      # copies lets the author diff them (llvm-objdump, bpftool btf dump)
      # instead of guessing at toolchains.
      - name: Upload both objects for comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bpf-objects-committed-vs-regenerated
          path: |
            /tmp/bpf-committed/
            bpf/*.o
          retention-days: 5
