name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  checks:
    name: Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('Makefile') }}

      - name: Install tools
        run: make install-tools

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: write
    steps:
      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2

      - name: Generate BPF objects
        run: go generate ./...

      - name: Run tests
        run: make test-ci

      - name: Fix test result permissions
        if: always()
        run: sudo chmod 644 test-results*.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: test-results*.xml
          reporter: java-junit

  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate BPF objects
        run: go generate ./...

      - name: Build cargowall
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cargowall-binary
          path: bin/cargowall
          retention-days: 1

  test-cargowall-enforce:
    name: Integration Test (Enforce Mode)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      - name: Warm systemd-resolved cache before attach (reproduce #89)
        run: |
          # GitHub's Azure runners resolve via systemd-resolved (127.0.0.53).
          # Populate its stub cache with a wildcard-matched name BEFORE cargowall
          # attaches. The concrete name can't be pre-tracked, so only the
          # attach-time cache flush makes the later getaddrinfo miss the stub and
          # re-resolve through the proxy — where **.githubusercontent.com matches
          # and the IP is allowed with attribution. Without the flush the warm
          # entry is served invisibly and the "hostname pattern" curl below is
          # blocked as a bare IP. Best-effort so runners without systemd-resolved
          # simply fall back to the cold-cache path.
          resolvectl query raw.githubusercontent.com 2>/dev/null \
            || getent ahosts raw.githubusercontent.com \
            || true
          echo "Warmed resolver cache for raw.githubusercontent.com"

      - name: Start CargoWall via Action
        uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
        env:
          # 3a telemetry: per-program overhead numbers (cg_origin_egress vs
          # the tc_egress baseline) land in the daemon's shutdown log during
          # the action's post step. Informational — shared-runner variance
          # makes ns thresholds flaky, so nothing asserts on them.
          CARGOWALL_BPF_STATS: 'true'
        with:
          mode: enforce
          offline: 'true'
          allowed-hosts: |
             docker.io
             docker.com
             **.githubusercontent.com
          binary-path: ./bin/cargowall
          debug: true

      - name: Test allowed connection via hostname pattern
        run: |
          # Runs FIRST among the connection tests: it doubles as the #89
          # regression check for raw.githubusercontent.com, which was warmed
          # into the systemd-resolved stub cache before attach (step above).
          # Keeping it first minimizes the warm→request window so a short record
          # TTL can't expire the entry and silently degrade this to the ordinary
          # cold-cache path. If the attach-time cache flush regresses, this
          # getaddrinfo is served invisibly from the warm stub, the proxy never
          # sees the name, and the connection is blocked as a bare IP — failing
          # here.
          curl -sf --connect-timeout 10 --max-time 30 https://raw.githubusercontent.com/github/gitignore/main/README.md > /dev/null
          echo "✅ raw.githubusercontent.com allowed via **.githubusercontent.com pattern (warm-cache re-resolved through proxy)"

      - name: Test allowed connection
        run: |
          curl -sf --connect-timeout 10 --max-time 30 https://github.com > /dev/null
          echo "✅ github.com allowed"

      - name: Test blocked connection
        run: |
          if curl -sf --connect-timeout 5 --max-time 10 https://example.com > /dev/null 2>&1; then
            echo "❌ example.com should be blocked"
            exit 1
          fi
          echo "✅ example.com blocked"

      - name: Test blocked direct IP connection
        run: |
          echo "Testing direct IP connection (bypassing DNS): 93.184.216.34 (example.com)"
          if curl -s --connect-timeout 5 --max-time 10 -o /dev/null http://93.184.216.34 2>&1; then
            echo "❌ Direct IP connection succeeded (should have been blocked)"
            exit 1
          fi
          echo "✅ Direct IP connection blocked"

      - name: Test Docker pull through cargowall
        run: |
          docker pull alpine:latest
          echo "✅ Docker pull succeeded through cargowall"

      - name: Test Docker container filtering
        run: |
          # Test container can reach allowed host
          docker run --rm alpine:latest sh -c "
            wget -q --spider --timeout=15 https://github.com && echo 'CONNECTION_SUCCESS' || echo 'CONNECTION_FAILED'
          " 2>&1 | grep -q "CONNECTION_SUCCESS"
          echo "✅ Docker container reached github.com"

          # Test container is blocked from non-allowed host
          RESULT=$(docker run --rm alpine:latest sh -c "
            wget -q --spider --timeout=5 https://example.com && echo 'CONNECTION_SUCCESS' || echo 'CONNECTION_BLOCKED'
          " 2>&1) || true
          if echo "$RESULT" | grep -q "CONNECTION_SUCCESS"; then
            echo "❌ Docker container should not reach example.com"
            exit 1
          fi
          echo "✅ Docker container blocked from example.com"

      - name: Container attribution scenarios (issue #106)
        run: |
          # The `sleep 1` inside each container puts the docker-events
          # tagging window behind us before the workload opens sockets: the
          # start→tag window is a documented 3a scope boundary (such traffic
          # lands in the stricter container tier), not what these assertions
          # measure.

          # Concurrent containers hitting DISTINCT blocked destinations —
          # proves per-container attribution doesn't cross wires under
          # concurrency. TEST-NET-2 IPs skip DNS entirely (deterministic TC
          # block, and SYN retransmits give the origin-record join several
          # shots) and can never carry real traffic.
          : > /tmp/cargowall-concurrent-cids
          for ip in 198.51.100.7 198.51.100.8 198.51.100.9; do
            CID=$(docker run -d --rm alpine:latest sh -c "sleep 1; wget -q --timeout=6 http://$ip/ || true; sleep 2")
            echo "$ip ${CID:0:12}" >> /tmp/cargowall-concurrent-cids
          done

          # Attributed container DNS: blocked at the resolver, so the
          # dns_blocked record is where container DNS attribution shows up.
          docker run --rm alpine:latest sh -c 'sleep 1; wget -q --timeout=5 https://container-dns-probe.example.com || true'

          # Give the three detached containers time to finish their fetches.
          sleep 12
          cat /tmp/cargowall-concurrent-cids

          # Exec re-tag: container born in THIS step, exec'd from the NEXT
          # step — the exec traffic must attribute to the next step's
          # ordinal, never this one's.
          CID=$(docker run -d --name cargowall-exec-test alpine:latest sleep 120)
          echo "${CID:0:12}" > /tmp/cargowall-exec-test-cid

      - name: Container exec attribution (separate step on purpose)
        run: |
          docker exec cargowall-exec-test sh -c 'sleep 1; wget -q --timeout=6 http://198.51.100.44/ || true'
          docker rm -f cargowall-exec-test

      - name: Bridge-local traffic (host→published port, container→container)
        run: |
          # Generates the two bridge traffic shapes the cgroup hook newly
          # adjudicates, so the shadow gate's zero-would-blocks-on-172.17.*
          # assertion below has real traffic to assert on. Without this the
          # assertion is vacuous: no other CI step publishes a port (host →
          # docker-proxy → container address) or runs container→container.
          docker run -d --rm --name cw-bridge-server -p 18083:8080 alpine:latest \
            sh -c 'while true; do printf "HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok" | nc -l -p 8080; done'
          ok=false
          for i in 1 2 3 4 5; do
            sleep 1
            curl -sf --max-time 5 http://127.0.0.1:18083/ > /dev/null && { ok=true; break; }
          done
          $ok || { echo "❌ published container port unreachable"; docker logs cw-bridge-server; exit 1; }
          SERVER_IP=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' cw-bridge-server)
          c2c=false
          for i in 1 2 3 4 5; do
            docker run --rm alpine:latest wget -q -T 5 -O- "http://$SERVER_IP:8080/" > /dev/null 2>&1 && { c2c=true; break; }
            sleep 1
          done
          $c2c || { echo "❌ container→container bridge traffic failed"; exit 1; }
          docker stop cw-bridge-server > /dev/null
          echo "✅ bridge-local traffic flows (host→published port, container→container)"

      - name: Validate audit log events
        run: |
          AUDIT_LOG=/tmp/cargowall-audit.json

          if [ ! -f "$AUDIT_LOG" ] || [ ! -s "$AUDIT_LOG" ]; then
            echo "❌ Audit log file not found or empty"
            exit 1
          fi
          echo "✅ Audit log exists ($(wc -l < "$AUDIT_LOG") lines)"

          EVENTS_VALID=true

          BLOCKED_COUNT=$(jq -s '[.[] | select(.event_type == "connection_blocked" and .blocked == true)] | length' "$AUDIT_LOG")
          echo "connection_blocked events (blocked=true): $BLOCKED_COUNT"
          if [ "$BLOCKED_COUNT" -eq 0 ]; then
            echo "❌ No connection_blocked events found"
            EVENTS_VALID=false
          fi

          DNS_BLOCKED_COUNT=$(jq -s '[.[] | select(.event_type == "dns_blocked")] | length' "$AUDIT_LOG")
          echo "dns_blocked events: $DNS_BLOCKED_COUNT"
          if [ "$DNS_BLOCKED_COUNT" -eq 0 ]; then
            echo "❌ No dns_blocked events found"
            EVENTS_VALID=false
          fi

          # Step attribution runs against the real Runner.Worker on this job
          # (the action passes --github-action, which implies it). The daemon
          # deliberately degrades to a warning when attribution can't start,
          # so these are the only assertions that catch a silent degrade on
          # the environment that matters.
          STEP_BOUNDARY_COUNT=$(jq -s '[.[] | select(.event_type == "step_boundary")] | length' "$AUDIT_LOG")
          echo "step_boundary events: $STEP_BOUNDARY_COUNT"
          if [ "$STEP_BOUNDARY_COUNT" -eq 0 ]; then
            echo "❌ No step_boundary events found (step attribution silently degraded?)"
            EVENTS_VALID=false
          fi

          # Every curl above ran in a post-attach `run:` step, so its
          # connection events must carry a real (small) step ordinal — not 0
          # (untagged) and not the runner/pre-daemon sentinels. The upper
          # bound is pkg/steps maxOrdinalBase (0xFFFFFFFE minus the 2^16
          # sentinel margin = 4294901758): no real ordinal can start there.
          STEP_TAGGED_COUNT=$(jq -s '[.[] | select(.event_type | test("^connection_")) | select((.step_ordinal // 0) > 0 and (.step_ordinal // 0) < 4294901758)] | length' "$AUDIT_LOG")
          echo "connection events with a real step_ordinal: $STEP_TAGGED_COUNT"
          if [ "$STEP_TAGGED_COUNT" -eq 0 ]; then
            echo "❌ No connection events carry a step ordinal"
            EVENTS_VALID=false
          fi

          # --- Container attribution (issue #106, phase 3a) ---
          # The daemon degrades to a warning when container attribution
          # can't start, so — as with step attribution above — these are the
          # assertions that catch a silent degrade on the environment that
          # matters. Ordinal bounds match the step assertions (real ordinal:
          # >0, below the sentinel margin).

          # Every container/exec tagging emits a container_attribution
          # marker; at least one must carry a real ordinal and a measured
          # tag latency.
          CONTAINER_ATTR_COUNT=$(jq -s '[.[] | select(.event_type == "container_attribution") | select((.step_ordinal // 0) > 0 and (.step_ordinal // 0) < 4294901758) | select((.tag_latency_ms // -1) >= 0)] | length' "$AUDIT_LOG")
          echo "container_attribution events with real ordinal: $CONTAINER_ATTR_COUNT"
          if [ "$CONTAINER_ATTR_COUNT" -eq 0 ]; then
            echo "❌ No container_attribution events with a real step ordinal (container attribution silently degraded?)"
            EVENTS_VALID=false
          fi

          # Container DNS: the resolver-blocked probe must be attributed to
          # its container and step (this is the "map the forwarded queries"
          # deliverable — a container's blocked DNS is no longer ordinal 0).
          DNS_CONTAINER_COUNT=$(jq -s '[.[] | select(.event_type == "dns_blocked" and .container_origin == true) | select((.step_ordinal // 0) > 0 and (.step_ordinal // 0) < 4294901758) | select(.container_id != null and .container_id != "")] | length' "$AUDIT_LOG")
          echo "container-attributed dns_blocked events: $DNS_CONTAINER_COUNT"
          if [ "$DNS_CONTAINER_COUNT" -eq 0 ]; then
            echo "❌ No dns_blocked events carry container attribution"
            EVENTS_VALID=false
          fi

          # Concurrent-container correctness: each TEST-NET destination's
          # blocked connection events must carry exactly the container that
          # fetched it (captured at docker run time), with one shared real
          # ordinal across all three (same step launched them).
          while read -r ip cid; do
            MATCHED=$(jq -s --arg ip "$ip" --arg cid "$cid" '[.[] | select(.event_type | test("^connection_")) | select(.dst_ip == $ip and .container_origin == true and .container_id == $cid) | select((.step_ordinal // 0) > 0 and (.step_ordinal // 0) < 4294901758)] | length' "$AUDIT_LOG")
            CROSSED=$(jq -s --arg ip "$ip" --arg cid "$cid" '[.[] | select(.event_type | test("^connection_")) | select(.dst_ip == $ip and (.container_id // "") != "" and .container_id != $cid)] | length' "$AUDIT_LOG")
            echo "dst $ip: container $cid attributed=$MATCHED crossed=$CROSSED"
            if [ "$MATCHED" -eq 0 ]; then
              echo "❌ No attributed connection events for $ip / $cid"
              EVENTS_VALID=false
            fi
            if [ "$CROSSED" -ne 0 ]; then
              echo "❌ Events for $ip attributed to a DIFFERENT container — join keys crossed wires"
              EVENTS_VALID=false
            fi
          done < /tmp/cargowall-concurrent-cids
          SHARED_ORDS=$(jq -s '[.[] | select(.event_type | test("^connection_")) | select(.dst_ip == "198.51.100.7" or .dst_ip == "198.51.100.8" or .dst_ip == "198.51.100.9") | select(.container_origin == true) | .step_ordinal] | unique | length' "$AUDIT_LOG")
          echo "distinct ordinals across the three concurrent containers: $SHARED_ORDS"
          if [ "$SHARED_ORDS" -ne 1 ]; then
            echo "❌ Concurrent containers launched by one step must share one ordinal"
            EVENTS_VALID=false
          fi

          # Exec re-tag: the exec attribution for the long-lived container
          # must carry a LATER ordinal than its start attribution (the exec
          # came from a later step).
          EXEC_CID=$(cat /tmp/cargowall-exec-test-cid)
          START_ORD=$(jq -s --arg cid "$EXEC_CID" '[.[] | select(.event_type == "container_attribution" and .container_id == $cid and .attribution_kind == "start")][0].step_ordinal // 0' "$AUDIT_LOG")
          EXEC_ORD=$(jq -s --arg cid "$EXEC_CID" '[.[] | select(.event_type == "container_attribution" and .container_id == $cid and .attribution_kind == "exec")][0].step_ordinal // 0' "$AUDIT_LOG")
          echo "exec-test container $EXEC_CID: start_ordinal=$START_ORD exec_ordinal=$EXEC_ORD"
          if [ "$START_ORD" -eq 0 ] || [ "$EXEC_ORD" -eq 0 ] || [ "$EXEC_ORD" -le "$START_ORD" ]; then
            echo "❌ Exec re-tag failed: exec ordinal must be a later step than the start ordinal"
            EVENTS_VALID=false
          fi

          # --- Cgroup egress hook, shadow mode (issue #106, phase 3b) ---
          # --github-action implies container attribution, which puts the
          # cgroup hook in SHADOW: it computes the verdict and reports what
          # it WOULD block, while TC still governs every packet. These
          # assertions are the blast-radius gate that must hold before
          # enforcement is turned on anywhere.

          # It must see the denied destinations the job deliberately visits.
          WOULD_BLOCK=$(jq -s '[.[] | select(.event_type == "cgroup_would_block")] | length' "$AUDIT_LOG")
          echo "cgroup_would_block events: $WOULD_BLOCK"
          if [ "$WOULD_BLOCK" -eq 0 ]; then
            echo "❌ No cgroup_would_block events (shadow mode silently degraded?)"
            EVENTS_VALID=false
          fi

          # Nothing was actually blocked by it: shadow must never claim a block.
          BAD_FLAGS=$(jq -s '[.[] | select(.event_type == "cgroup_would_block" and .blocked == true)] | length' "$AUDIT_LOG")
          if [ "$BAD_FLAGS" -ne 0 ]; then
            echo "❌ cgroup_would_block events marked blocked=true — shadow mode must block nothing"
            EVENTS_VALID=false
          fi

          # The blast radius itself: the surfaces this hook adjudicates that
          # TC never saw — loopback (TC is attached to one interface) and the
          # docker bridge. A would-block there is a NEW denial that turning
          # on enforcement would introduce, and would break the runner.
          #
          # Deliberately not asserted here: DNS to a resolver the policy
          # doesn't allow. That is a legitimate denial TC makes too, not
          # something this hook introduces — asserting on port 53 would
          # conflate "the cgroup hook newly breaks DNS" with "policy denies
          # this resolver anyway" and fail spuriously.
          BLAST=$(jq -s '[.[] | select(.event_type == "cgroup_would_block") | select(((.dst_ip // "") | startswith("127.")) or ((.dst_ip // "") | startswith("172.17.")))] | length' "$AUDIT_LOG")
          echo "would-blocks on loopback/docker bridge (must be 0): $BLAST"
          if [ "$BLAST" -ne 0 ]; then
            echo "❌ Shadow mode would block loopback/bridge traffic — enforcement would break the runner"
            jq -c 'select(.event_type == "cgroup_would_block") | {dst_ip, dst_port, process, container_id}' "$AUDIT_LOG" | head -20
            EVENTS_VALID=false
          fi

          # Allowed destinations must never be would-blocked — that would mean
          # the cgroup hook and TC disagree about policy.
          BLAST_ALLOWED=$(jq -s '[.[] | select(.event_type == "cgroup_would_block") | select((.dst_hostname // "") | test("github|githubusercontent|docker"))] | length' "$AUDIT_LOG")
          if [ "$BLAST_ALLOWED" -ne 0 ]; then
            echo "❌ Shadow mode would block an ALLOWED host — hook/TC policy divergence"
            EVENTS_VALID=false
          fi

          echo "--- cgroup_would_block events ---"
          jq -c 'select(.event_type == "cgroup_would_block") | {dst_ip, dst_port, protocol, process, step_ordinal, container_id, container_origin}' "$AUDIT_LOG" | head -20

          # Evidence dump: the raw attribution rows, so a passing run shows
          # first-hand what was tagged (and a failing one shows what wasn't).
          echo "--- step_boundary events ---"
          jq -c 'select(.event_type == "step_boundary") | {step_ordinal, pid, process}' "$AUDIT_LOG"
          echo "--- container_attribution events ---"
          jq -c 'select(.event_type == "container_attribution") | {attribution_kind, container_id, step_ordinal, pid, tag_latency_ms, privileged}' "$AUDIT_LOG"
          echo "--- attributed connection events ---"
          jq -c 'select(.event_type | test("^connection_")) | {step_ordinal: (.step_ordinal // 0), event_type, dst_hostname, dst_ip, dst_port, process, container_id: (.container_id // ""), container_origin: (.container_origin // false)}' "$AUDIT_LOG"

          if [ "$EVENTS_VALID" = true ]; then
            echo "✅ Audit log contains expected event types"
          else
            echo "❌ Audit log missing expected event types"
            echo "Sample entries:"
            head -5 "$AUDIT_LOG" | jq .
            exit 1
          fi

      - name: Test summary command
        run: |
          SUMMARY_OUTPUT=$(./bin/cargowall summary --audit-log /tmp/cargowall-audit.json --steps '[]' 2>&1)

          echo "Summary output:"
          echo "$SUMMARY_OUTPUT"

          SUMMARY_VALID=true

          if ! echo "$SUMMARY_OUTPUT" | grep -q "Enforce Mode"; then
            echo "❌ Missing 'Enforce Mode' header"
            SUMMARY_VALID=false
          fi

          if ! echo "$SUMMARY_OUTPUT" | grep -q "### Summary"; then
            echo "❌ Missing '### Summary' section"
            SUMMARY_VALID=false
          fi

          if ! echo "$SUMMARY_OUTPUT" | grep -q "Connections blocked"; then
            echo "❌ Missing 'Connections blocked' metric"
            SUMMARY_VALID=false
          fi

          if [ "$SUMMARY_VALID" = true ]; then
            echo "✅ Summary command produces valid markdown"
          else
            echo "❌ Summary command output missing expected content"
            exit 1
          fi

  test-cargowall-cgroup-enforce:
    name: Integration Test (Cgroup Enforce)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      - name: Pre-create a user-defined bridge (service-container shape)
        run: |
          # Created BEFORE cargowall starts: its subnet must reach the
          # cgroup hook's carve-out via the pre-enableMode pre-scan, because
          # docker-event tracking begins only later. Asserted after the
          # other bridge steps below.
          docker network create cw-pre > /dev/null
          docker run -d --name cw-pre-server --network cw-pre alpine:latest \
            sh -c 'while true; do printf "HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok" | nc -l -p 8080; done'

      - name: Start CargoWall with cgroup enforcement (issue #106 phase 3b)
        uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
        env:
          # The whole point of this job: the root-cgroup hook is
          # authoritative for traffic with a local socket (pre-NAT, socket
          # context), with TC egress still attached as the fail-closed
          # backstop for everything else.
          CARGOWALL_CGROUP_ENFORCE: 'true'
        with:
          mode: enforce
          offline: 'true'
          allowed-hosts: |
             docker.io
             docker.com
             **.githubusercontent.com
          binary-path: ./bin/cargowall
          debug: true

      - name: Loopback must still work
        run: |
          # TC is attached to one interface and never saw `lo`; the cgroup
          # hook does. If the loopback carve-out regresses, enforcement
          # breaks every local service on the runner — this is the single
          # highest-blast-radius behavior change in phase 3b.
          python3 -m http.server 18080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18080/ || echo "000")
          kill %1 2>/dev/null || true
          if [ "$CODE" != "200" ]; then
            echo "❌ Loopback blocked under cgroup enforcement (got HTTP '$CODE')"
            exit 1
          fi
          echo "✅ Loopback reachable ($CODE)"

      - name: DNS and allowed hosts must still work
        run: |
          # The proxy's own upstream queries are SO_MARK-exempt in the hook;
          # if that regresses, name resolution dies and everything else with it.
          getent hosts github.com > /dev/null || { echo "❌ DNS resolution broken"; exit 1; }
          curl -sf --connect-timeout 10 --max-time 30 https://raw.githubusercontent.com/github/gitignore/main/README.md > /dev/null \
            || { echo "❌ Allowed host unreachable under cgroup enforcement"; exit 1; }
          echo "✅ DNS + allowed host reachable"

      - name: Blocked host is still blocked (host socket)
        run: |
          # Now enforced by the cgroup hook rather than TC. For TCP the drop
          # is NOT fast: the SYN dies in ip_finish_output and connect() only
          # short-circuits on ECONNREFUSED, so curl runs into its own
          # --connect-timeout — same UX as TC's blackhole, either way
          # non-zero. (Fast EPERM is UDP-only; the probe step below pins it.)
          if curl -sf --connect-timeout 5 --max-time 10 https://example.com > /dev/null 2>&1; then
            echo "❌ example.com should be blocked"
            exit 1
          fi
          echo "✅ example.com blocked"

      - name: Deliberate direct-IP block probe (TEST-NET-3)
        run: |
          # Prove an enforced drop end to end — deliberately, in THIS job,
          # because its policy is supplied locally (offline mode): there is
          # no SaaS push and no notification client, so the denial is
          # asserted right here and reported nowhere else. The API-backed
          # jobs must not run this probe — a deliberate block would land in
          # the product's report for the run.
          #
          # 203.0.113.9:9999 is TEST-NET-3 (RFC 5737): reserved, unroutable,
          # matches no allowlist, and recognizable in any audit log as a
          # cargowall test artifact. (The BPF unit suite deliberately does
          # NOT use an off-host address — its probe targets the host's own
          # IP over lo so a production cargowall can never see it; this job
          # is the one place a real off-host denial is exercised, because
          # only here is the report guaranteed to stay local.)
          # UDP, because only UDP surfaces the drop synchronously: sendto()
          # returns EPERM from the cgroup hook. The audit record for this
          # exact tuple is asserted in "Validate enforcement events" below.
          GOT=$(python3 -c 'import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          try:
              s.sendto(b"cargowall-ci-probe", ("203.0.113.9", 9999))
              print("SENT")
          except OSError as e:
              print(e.errno)')
          if [ "$GOT" != "1" ]; then
            echo "❌ expected EPERM (errno 1) sending to 203.0.113.9:9999, got: $GOT"
            exit 1
          fi
          echo "✅ direct-IP probe denied with EPERM at the socket layer"

      - name: Bridge-local traffic must survive enforcement
        run: |
          # Host→published-port and container→container ride the docker
          # bridge — local-only surfaces TC never adjudicated, newly seen by
          # the enforcing cgroup hook. The carve-outs (default bridge +
          # pre-existing containers before enableMode, user-defined bridges
          # via tracker discovery) are what keep them alive; before those
          # existed, every shape below died with default-deny.
          cleanup() {
            docker rm -f cw-bridge-enforce cw-udn-server > /dev/null 2>&1 || true
            docker network rm cw-udn > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # retry <label> <cmd...>: the servers, the tracker's async subnet
          # discovery, and busybox nc's between-connections gap all need a
          # few attempts — a single try here reads as an enforcement bug
          # when it is only a race.
          retry() {
            label="$1"; shift
            for i in 1 2 3 4 5 6 7 8; do
              sleep 1
              "$@" > /dev/null 2>&1 && return 0
            done
            echo "❌ $label"
            return 1
          }
          serve='while true; do printf "HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok" | nc -l -p 8080; done'
          docker run -d --name cw-bridge-enforce -p 18084:8080 alpine:latest sh -c "$serve"
          retry "published port dead under cgroup enforcement" \
            curl -sf --max-time 5 http://127.0.0.1:18084/
          SERVER_IP=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' cw-bridge-enforce)
          retry "container→container dead under cgroup enforcement" \
            docker run --rm alpine:latest wget -q -T 5 -O- "http://$SERVER_IP:8080/"

          # User-defined bridge created NOW: its subnet is carved out only
          # via the tracker's per-container discovery — the path with no
          # startup-time equivalent.
          docker network create cw-udn > /dev/null
          docker run -d --name cw-udn-server --network cw-udn alpine:latest sh -c "$serve"
          retry "user-defined bridge container→container dead under cgroup enforcement" \
            docker run --rm --network cw-udn alpine:latest wget -q -T 5 -O- "http://cw-udn-server:8080/"
          echo "✅ bridge-local traffic survives cgroup enforcement (default + user-defined bridge)"

      - name: Pre-existing user-defined bridge must survive enforcement
        run: |
          # The network and server below were created BEFORE cargowall
          # started (previous step's job order — see the pre-start step near
          # the top of this job): their subnet reaches the carve-out via the
          # pre-scan that runs before enableMode, not via event tracking.
          # This is the GitHub service-container / compose-stack shape.
          for i in 1 2 3 4 5 6 7 8; do
            sleep 1
            docker run --rm --network cw-pre alpine:latest wget -q -T 5 -O- "http://cw-pre-server:8080/" > /dev/null 2>&1 && {
              echo "✅ pre-existing user-defined bridge survives enforcement"
              docker rm -f cw-pre-server > /dev/null 2>&1 || true
              docker network rm cw-pre > /dev/null 2>&1 || true
              exit 0
            }
          done
          echo "❌ pre-existing user-defined bridge dead under cgroup enforcement (pre-scan regression)"
          docker rm -f cw-pre-server > /dev/null 2>&1 || true
          docker network rm cw-pre > /dev/null 2>&1 || true
          exit 1

      - name: Container traffic is enforced and attributed
        run: |
          docker pull -q alpine:latest
          # Allowed destination still reachable from inside a container.
          docker run --rm alpine:latest sh -c \
            "wget -q --spider --timeout=15 https://github.com && echo OK || echo FAIL" 2>&1 | grep -q OK \
            || { echo "❌ Container cannot reach an allowed host under cgroup enforcement"; exit 1; }
          echo "✅ Container reached github.com"

          # Denied destination: dropped in the container's own netns, before
          # NAT — so TC never sees the packet and the cgroup hook is the sole
          # event source for it.
          RESULT=$(docker run --rm alpine:latest sh -c \
            "sleep 1; wget -q --timeout=8 http://198.51.100.7/ && echo REACHED || echo BLOCKED" 2>&1) || true
          if echo "$RESULT" | grep -q REACHED; then
            echo "❌ Container reached a denied destination"
            exit 1
          fi
          echo "✅ Container blocked from 198.51.100.7"

      - name: Validate enforcement events
        run: |
          AUDIT_LOG=/tmp/cargowall-audit.json
          test -s "$AUDIT_LOG" || { echo "❌ Audit log missing"; exit 1; }
          VALID=true

          # In enforce mode a cgroup drop reports as a real connection_blocked
          # (same policy outcome as a TC drop), never as a would-block.
          WOULD=$(jq -s '[.[] | select(.event_type == "cgroup_would_block")] | length' "$AUDIT_LOG")
          echo "cgroup_would_block events (expected 0 in enforce): $WOULD"
          if [ "$WOULD" -ne 0 ]; then
            echo "❌ Enforce mode emitted would-block events"
            VALID=false
          fi

          # The container block must carry native attribution — a real step
          # ordinal AND a container id — with no TC event to join against,
          # which is the core phase-3b claim.
          ATTRIBUTED=$(jq -s '[.[] | select(.event_type == "connection_blocked" and .dst_ip == "198.51.100.7") | select(.container_origin == true) | select((.step_ordinal // 0) > 0 and (.step_ordinal // 0) < 4294901758) | select((.container_id // "") != "")] | length' "$AUDIT_LOG")
          echo "natively attributed container blocks: $ATTRIBUTED"
          if [ "$ATTRIBUTED" -eq 0 ]; then
            echo "❌ Container block lacks native step/container attribution"
            VALID=false
          fi

          # The deliberate TEST-NET-3 probe must have produced its audit
          # record: the drop already proved enforcement (EPERM), this proves
          # the cgroup hook is also the event source for what it drops —
          # "every drop we cause emits a record".
          PROBE=$(jq -s '[.[] | select(.event_type == "connection_blocked" and .dst_ip == "203.0.113.9" and .dst_port == 9999)] | length' "$AUDIT_LOG")
          echo "TEST-NET-3 probe blocked events: $PROBE"
          if [ "$PROBE" -eq 0 ]; then
            echo "❌ Probe was dropped but produced no connection_blocked audit event"
            VALID=false
          fi

          # Nothing on loopback or an allowed host may be blocked. (DNS to a
          # resolver the policy doesn't allow is a legitimate denial TC makes
          # too, so port 53 alone is not the signal — see the shadow job.)
          BAD=$(jq -s '[.[] | select(.event_type == "connection_blocked") | select(((.dst_ip // "") | startswith("127.")) or ((.dst_ip // "") | test("^172\\.(1[6-9]|2[0-9]|3[01])\\.")) or ((.dst_hostname // "") | test("github|githubusercontent")))] | length' "$AUDIT_LOG")
          if [ "$BAD" -ne 0 ]; then
            echo "❌ Enforcement blocked loopback/bridge/allowed traffic:"
            jq -c 'select(.event_type == "connection_blocked") | {dst_ip, dst_hostname, dst_port, process}' "$AUDIT_LOG" | head -20
            VALID=false
          fi

          echo "--- blocked events ---"
          jq -c 'select(.event_type == "connection_blocked") | {dst_ip, dst_port, process, step_ordinal, container_id, container_origin}' "$AUDIT_LOG" | head -20

          [ "$VALID" = true ] || exit 1
          echo "✅ Cgroup enforcement events are correct"

  test-cargowall-audit:
    name: Integration Test (Audit Mode)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      - name: Start CargoWall via Action
        uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
        with:
          mode: audit
          offline: 'true'
          binary-path: ./bin/cargowall
          debug: true

      - name: Test audit mode allows connections
        run: |
          curl -sf --connect-timeout 10 --max-time 30 https://example.com > /dev/null
          echo "✅ example.com allowed in audit mode"

  test-sudo-lockdown:
    name: Integration Test (Sudo Lockdown)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      - name: Snapshot pre-lockdown sudo state
        run: |
          echo "--- Runner user info ---"
          id runner
          echo "--- Groups ---"
          groups runner
          echo "--- sudoers.d contents ---"
          sudo ls -la /etc/sudoers.d/
          echo "--- Verify runner has full sudo ---"
          sudo whoami
          echo "--- Save sudoers.d file list for later comparison ---"
          sudo ls /etc/sudoers.d/ | sort > /tmp/sudoers-before.txt

      - name: Start CargoWall with sudo lockdown
        run: |
          # Start cargowall inside a root wrapper that watches for a stop
          # trigger. Once lockdown is active the runner user cannot sudo kill,
          # so we need an already-root process that can send SIGTERM.
          sudo bash -c '
            ./bin/cargowall start \
              --github-action \
              --audit-mode \
              --sudo-lockdown \
              --sudo-allow-commands "/usr/sbin/iptables,/usr/sbin/ip6tables" \
              --dns-upstream "8.8.8.8:53" &
            CW_PID=$!
            echo $CW_PID > /tmp/cargowall-pid
            # Wait for stop trigger (created by a later step — no sudo needed)
            while [ ! -f /tmp/cargowall-stop ]; do sleep 1; done
            kill -TERM $CW_PID
            wait $CW_PID 2>/dev/null
          ' &

          # Wait for cargowall to be ready
          for i in $(seq 1 30); do
            if [ -f /tmp/cargowall-ready ]; then
              echo "CargoWall ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [ ! -f /tmp/cargowall-ready ]; then
            echo "CargoWall did not become ready"
            exit 1
          fi

      - name: Test allowed sudo command works
        run: |
          if sudo /usr/sbin/iptables -L -n > /dev/null 2>&1; then
            echo "✅ Allowed command (iptables) works via sudo"
          else
            echo "❌ Allowed command (iptables) failed via sudo"
            exit 1
          fi

      - name: Test blocked sudo command is denied
        run: |
          OUTPUT=$(sudo -n /usr/bin/apt-get --version 2>&1) && {
            echo "❌ apt-get should be blocked by sudo lockdown"
            exit 1
          }
          if echo "$OUTPUT" | grep -qiE "not allowed|not in sudoers|may not run|a password is required"; then
            echo "✅ Blocked command (apt-get) denied by sudo"
          else
            echo "❌ apt-get failed but not due to sudoers denial: $OUTPUT"
            exit 1
          fi

      - name: Test sudo bash is denied
        run: |
          OUTPUT=$(sudo -n /bin/bash -c "echo pwned" 2>&1) && {
            echo "❌ sudo bash should be blocked"
            exit 1
          }
          if echo "$OUTPUT" | grep -qiE "not allowed|not in sudoers|may not run|a password is required"; then
            echo "✅ sudo bash denied"
          else
            echo "❌ bash failed but not due to sudoers denial: $OUTPUT"
            exit 1
          fi

      - name: Test sudo kill is denied
        run: |
          OUTPUT=$(sudo -n /usr/bin/kill -0 1 2>&1) && {
            echo "❌ sudo kill should be blocked (not in allow list)"
            exit 1
          }
          if echo "$OUTPUT" | grep -qiE "not allowed|not in sudoers|may not run|a password is required"; then
            echo "✅ sudo kill denied"
          else
            echo "❌ kill failed but not due to sudoers denial: $OUTPUT"
            exit 1
          fi

      - name: Stop CargoWall and verify cleanup
        run: |
          CW_PID=$(cat /tmp/cargowall-pid)

          # Signal the root wrapper to send SIGTERM — no sudo needed
          touch /tmp/cargowall-stop

          # Wait for cargowall to exit. Use /proc to check since kill -0
          # requires permission on a root-owned process.
          for i in $(seq 1 15); do
            if [ ! -d "/proc/$CW_PID" ]; then
              echo "CargoWall stopped after ${i}s"
              break
            fi
            sleep 1
          done
          if [ -d "/proc/$CW_PID" ]; then
            echo "❌ CargoWall did not stop within 15s"
            exit 1
          fi

      - name: Verify sudo access restored
        run: |
          echo "--- sudoers.d after cleanup ---"
          sudo ls -la /etc/sudoers.d/

          # Lockdown file should be removed
          if sudo test -f /etc/sudoers.d/zz-cargowall-lockdown; then
            echo "❌ Lockdown sudoers file still exists after cleanup"
            exit 1
          fi
          echo "✅ Lockdown sudoers file removed"

          # State file should be removed
          if sudo test -f /etc/sudoers.d/.cargowall-lockdown-state; then
            echo "❌ State file still exists after cleanup"
            exit 1
          fi
          echo "✅ State file removed"

          # Disabled files should be restored
          STILL_DISABLED=$(sudo ls /etc/sudoers.d/ | grep -c '\.cargowall-disabled$' || true)
          if [ "$STILL_DISABLED" -gt 0 ]; then
            echo "❌ $STILL_DISABLED sudoers files still disabled after cleanup"
            sudo ls -la /etc/sudoers.d/
            exit 1
          fi
          echo "✅ All disabled sudoers files restored"

          # sudoers.d should be back to original state
          sudo ls /etc/sudoers.d/ | sort > /tmp/sudoers-after.txt
          if ! diff /tmp/sudoers-before.txt /tmp/sudoers-after.txt; then
            echo "❌ sudoers.d contents differ from pre-lockdown state"
            exit 1
          fi
          echo "✅ sudoers.d contents match pre-lockdown state"

      - name: Verify runner has full sudo again
        run: |
          if sudo whoami > /dev/null 2>&1; then
            echo "✅ Full sudo access restored"
          else
            echo "❌ sudo access not restored after cleanup"
            exit 1
          fi

          # Verify unrestricted commands work again
          if sudo apt-get --version > /dev/null 2>&1; then
            echo "✅ Previously blocked commands now work"
          else
            echo "❌ apt-get still blocked after cleanup"
            exit 1
          fi

      - name: Emergency cleanup
        if: always()
        run: |
          # Signal the root wrapper to stop cargowall gracefully
          touch /tmp/cargowall-stop
          sleep 5
          # If we still have sudo, clean up any remnants
          if sudo -n true 2>/dev/null; then
            sudo rm -f /etc/sudoers.d/zz-cargowall-lockdown
            sudo rm -f /etc/sudoers.d/.cargowall-lockdown-state
            for f in /etc/sudoers.d/*.cargowall-disabled; do
              [ -f "$f" ] || continue
              sudo mv "$f" "${f%.cargowall-disabled}"
            done
            for group in sudo admin wheel; do
              sudo gpasswd -a runner "$group" 2>/dev/null || true
            done
          fi
          echo "Emergency cleanup complete"

