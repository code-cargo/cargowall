  test-cargowall-gitlab-ci:
    name: Integration Test (GitLab CI mode)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      - name: Write minimal policy
        run: |
          sudo mkdir -p /etc/cargowall
          sudo tee /etc/cargowall/config.json > /dev/null <<'JSON'
          {
            "defaultAction": "deny",
            "rules": [
              {
                "type": "hostname",
                "value": "github.com",
                "ports": [{"port": 443, "protocol": "tcp"}],
                "action": "allow"
              },
              {
                "type": "cidr",
                "value": "8.8.8.8/32",
                "ports": [{"port": 53, "protocol": "udp"}],
                "action": "allow"
              }
            ],
            "searchDomains": [".compute.internal"]
          }
          JSON

      - name: Start CargoWall with --gitlab-ci preset
        run: |
          # nohup + & + disown lets cargowall outlive this step's shell.
          # The privileged-Docker stand-in for GitLab SaaS doesn't exist on
          # GitHub Actions runners, so we exercise the same code path on the
          # Azure-backed Linux runner — eBPF + sudo + iptables work the same.
          sudo nohup ./bin/cargowall start \
            --gitlab-ci \
            --audit-mode \
            --audit-log /tmp/cargowall-audit.json \
            --pidfile /tmp/cargowall.pid \
            --dns-upstream "8.8.8.8:53" \
            --debug \
            > /tmp/cargowall.log 2>&1 &
          disown

      - name: Wait for ready via wait-ready subcommand
        run: ./bin/cargowall wait-ready --timeout 30s

      - name: Show startup log (debug aid)
        if: always()
        run: sudo cat /tmp/cargowall.log || true

      - name: Verify systemd-resolved cache flush ran at attach (#89)
        run: |
          # On the Azure runner the client resolver is systemd-resolved, whose
          # warm stub cache used to serve pre-attach answers invisibly (#89).
          # With the DNS redirect active (--gitlab-ci preset), cargowall flushes
          # that cache at attach so future lookups traverse the proxy. Assert the
          # FlushResolvedCache path executed — the flush itself on a resolved
          # host, or the documented best-effort skip elsewhere.
          if sudo grep -q "Flushed systemd-resolved DNS cache" /tmp/cargowall.log; then
            echo "✅ resolved cache flushed at attach"
          elif sudo grep -qE "systemd-resolved not running|resolvectl not found" /tmp/cargowall.log; then
            echo "ℹ️ systemd-resolved not in use on this runner; flush correctly skipped"
          else
            echo "❌ neither flush nor skip logged — FlushResolvedCache path not reached"
            sudo grep -iE "resolv|flush|dns redirect" /tmp/cargowall.log || true
            exit 1
          fi

      - name: Verify pidfile written
        run: |
          if ! sudo test -s /tmp/cargowall.pid; then
            echo "❌ pidfile /tmp/cargowall.pid was not written"
            exit 1
          fi
          echo "✅ pidfile present, pid=$(sudo cat /tmp/cargowall.pid)"

      - name: Allowed call reaches github.com
        run: |
          curl -sf --connect-timeout 10 --max-time 30 https://github.com > /dev/null
          echo "✅ github.com reachable"

      - name: Disallowed call still goes through (audit mode logs only)
        run: |
          curl -sf --connect-timeout 5 --max-time 10 https://example.com > /dev/null || true
          echo "✅ example.com fetch attempted (audit mode does not block)"

      - name: DNS query under search-domain suffix is NOT logged as blocked
        run: |
          # `.compute.internal` is configured as a search domain (see policy
          # above). A query for a name under that suffix with no matching
          # hostname rule should pass cargowall's filter via the bypass.
          # In audit mode this means: no dns_blocked event is logged for it.
          # The upstream will return NXDOMAIN for an ephemeral name like
          # this, which is fine — we only care about cargowall's verdict.
          dig +time=5 +tries=1 @127.0.0.1 ip-10-0-0-5.us-west-2.compute.internal A > /tmp/bypass-query.log 2>&1 || true
          cat /tmp/bypass-query.log
          echo "✅ search-domain query issued"

      - name: DNS query NOT covered by rule or search-domain IS logged
        run: |
          # No hostname rule, no search-domain match — cargowall should log
          # this as dns_blocked-would (audit mode lets the query through
          # but records the would-be-deny).
          dig +time=5 +tries=1 @127.0.0.1 nonexistent.example.org A > /tmp/blocked-query.log 2>&1 || true
          cat /tmp/blocked-query.log
          echo "✅ control query issued"

      - name: Verify search-domain bypass distinguished from would-deny
        run: |
          AUDIT_LOG=/tmp/cargowall-audit.json
          if ! sudo test -s "$AUDIT_LOG"; then
            echo "❌ Audit log not written"
            exit 1
          fi

          # The bypassed query must NOT appear in dns_blocked events.
          BYPASSED_LOGGED=$(sudo jq -s '[
            .[] | select(.event_type == "dns_blocked")
                | select((.dst_hostname // "") | contains("compute.internal"))
          ] | length' "$AUDIT_LOG")
          if [ "$BYPASSED_LOGGED" -ne 0 ]; then
            echo "❌ search-domain query incorrectly logged as dns_blocked ($BYPASSED_LOGGED entries)"
            sudo jq -s '.[] | select(.event_type == "dns_blocked")' "$AUDIT_LOG"
            exit 1
          fi
          echo "✅ search-domain query not in dns_blocked log"

          # The control query MUST appear in dns_blocked.
          BLOCKED_LOGGED=$(sudo jq -s '[
            .[] | select(.event_type == "dns_blocked")
                | select((.dst_hostname // "") | contains("nonexistent.example.org"))
          ] | length' "$AUDIT_LOG")
          if [ "$BLOCKED_LOGGED" -eq 0 ]; then
            echo "❌ control query missing from dns_blocked log"
            sudo jq -s '.[] | select(.event_type == "dns_blocked")' "$AUDIT_LOG"
            exit 1
          fi
          echo "✅ control query correctly in dns_blocked log"

      - name: Verify cloud-provider detection ran
        run: |
          # --gitlab-ci enables --auto-allow-cloud-metadata, which triggers
          # the new detectCloudProvider path. GitHub-hosted runners are on
          # Azure VMs, so detection should resolve to "azure" via the
          # chassis_asset_tag or wireserver-upstream fallback.
          if ! sudo grep -q "Cloud provider detection" /tmp/cargowall.log; then
            echo "❌ 'Cloud provider detection' log line missing"
            sudo grep -i "cloud\|detect" /tmp/cargowall.log || true
            exit 1
          fi
          DETECTED=$(sudo grep "Cloud provider detection" /tmp/cargowall.log | head -1)
          echo "✅ Cloud provider detection ran: $DETECTED"

      - name: Validate audit log contains would-deny events
        run: |
          AUDIT_LOG=/tmp/cargowall-audit.json
          if ! sudo test -s "$AUDIT_LOG"; then
            echo "❌ Audit log not written"
            exit 1
          fi
          BLOCKED=$(sudo jq -s '[.[] | select(.event_type == "connection_blocked" or .event_type == "dns_blocked")] | length' "$AUDIT_LOG")
          echo "would-deny events: $BLOCKED"
          if [ "$BLOCKED" -eq 0 ]; then
            echo "❌ Expected at least one would-deny event in audit log"
            sudo head -5 "$AUDIT_LOG" | jq .
            exit 1
          fi
          echo "✅ Audit log contains $BLOCKED would-deny events"

      - name: Stop CargoWall via stop subcommand
        run: |
          sudo ./bin/cargowall stop --pidfile /tmp/cargowall.pid --timeout 15s
          echo "✅ stop subcommand returned cleanly"

      - name: Verify pidfile removed
        run: |
          if sudo test -f /tmp/cargowall.pid; then
            echo "❌ pidfile still present after stop"
            sudo ls -la /tmp/cargowall.pid
            exit 1
          fi
          echo "✅ pidfile cleaned up"

      - name: Emergency cleanup
        if: always()
        run: |
          if sudo test -f /tmp/cargowall.pid; then
            sudo kill -TERM $(sudo cat /tmp/cargowall.pid) 2>/dev/null || true
          fi

  test-cargowall-saas:
    name: Integration Test (SaaS)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
        with:
          binary-path: ./bin/cargowall
