name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  checks:
    name: Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('Makefile') }}

      - name: Install tools
        run: make install-tools

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: write
    steps:
      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2

      - name: Generate BPF objects
        run: go generate ./...

      - name: Run tests
        run: make test-ci

      - name: Fix test result permissions
        if: always()
        run: sudo chmod 644 test-results*.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: test-results*.xml
          reporter: java-junit

  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install eBPF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Generate BPF objects
        run: go generate ./...

      - name: Build cargowall
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cargowall-binary
          path: bin/cargowall
          retention-days: 1

  test-cargowall-enforce:
    name: Integration Test (Enforce Mode)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      # Step bodies live in scripts/ci/enforce.sh; the YAML is wiring.
      - name: Warm systemd-resolved cache before attach (reproduce #89)
        run: bash scripts/ci/enforce.sh warm-resolver

      - name: Start CargoWall via Action
        uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
        env:
          # 3a telemetry: per-program overhead numbers (cg_origin_egress vs
          # the tc_egress baseline) land in the daemon's shutdown log during
          # the action's post step. Informational — shared-runner variance
          # makes ns thresholds flaky, so nothing asserts on them.
          CARGOWALL_BPF_STATS: 'true'
        with:
          mode: enforce
          offline: 'true'
          allowed-hosts: |
             docker.io
             docker.com
             **.githubusercontent.com
          binary-path: ./bin/cargowall
          debug: true

      - name: Test allowed connection via hostname pattern
        run: bash scripts/ci/enforce.sh allowed-pattern

      - name: Test allowed connection
        run: bash scripts/ci/enforce.sh allowed

      - name: Test blocked connection
        run: bash scripts/ci/enforce.sh blocked

      - name: DNS step attribution evidence (issue 110)
        run: bash scripts/ci/enforce.sh dns-attribution

      - name: Test blocked direct IP connection
        run: bash scripts/ci/enforce.sh blocked-ip

      - name: Test Docker pull through cargowall
        run: bash scripts/ci/enforce.sh docker-pull

      - name: Test Docker container filtering
        run: bash scripts/ci/enforce.sh docker-filter

      # The four steps below are backed by scripts/ci/container-attribution.sh;
      # the YAML is wiring. One workflow step per subcommand is load-bearing:
      # step ordinals come from step boundaries, and the validate assertions
      # test relations between them (exec ordinal > start ordinal; the three
      # concurrent containers share one).
      - name: Container attribution scenarios (issue #106)
        run: bash scripts/ci/container-attribution.sh scenarios

      - name: Container exec attribution (separate step on purpose)
        run: bash scripts/ci/container-attribution.sh exec

      - name: Bridge-local traffic (host→published port, container→container)
        run: bash scripts/ci/container-attribution.sh bridge

      - name: Validate audit log events
        run: bash scripts/ci/container-attribution.sh validate

      - name: Test summary command
        run: bash scripts/ci/enforce.sh summary

  test-cargowall-cgroup-enforce:
    name: Integration Test (Cgroup Enforce)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      # The job body lives in scripts/ci/cgroup-enforce.sh; this YAML is
      # wiring only. `pre` runs before cargowall starts (pre-enableMode
      # pre-scan shape), `verify` holds every post-start assertion.
      - name: Pre-create a user-defined bridge (service-container shape)
        run: bash scripts/ci/cgroup-enforce.sh pre

      - name: Start CargoWall with cgroup enforcement (issue #106 phase 3b)
        uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
        env:
          # The whole point of this job: the root-cgroup hook is
          # authoritative for traffic with a local socket (pre-NAT, socket
          # context), with TC egress still attached as the fail-closed
          # backstop for everything else.
          CARGOWALL_CONTAINER_EGRESS: 'enforce'
        with:
          mode: enforce
          offline: 'true'
          allowed-hosts: |
             docker.io
             docker.com
             **.githubusercontent.com
          binary-path: ./bin/cargowall
          debug: true

      - name: Verify cgroup enforcement
        run: bash scripts/ci/cgroup-enforce.sh verify

  test-cargowall-audit:
    name: Integration Test (Audit Mode)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      - name: Start CargoWall via Action
        uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
        with:
          mode: audit
          offline: 'true'
          binary-path: ./bin/cargowall
          debug: true

      - name: Test audit mode allows connections
        run: |
          curl -sf --connect-timeout 10 --max-time 30 https://example.com > /dev/null
          echo "✅ example.com allowed in audit mode"

  test-sudo-lockdown:
    name: Integration Test (Sudo Lockdown)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      # Step bodies live in scripts/ci/sudo-lockdown.sh (shared with the
      # full-block job below); the YAML is wiring.
      - name: Snapshot pre-lockdown sudo state
        run: bash scripts/ci/sudo-lockdown.sh snapshot

      - name: Start CargoWall with sudo lockdown
        run: bash scripts/ci/sudo-lockdown.sh start "/usr/sbin/iptables,/usr/sbin/ip6tables"

      - name: Test allowed sudo command works
        run: bash scripts/ci/sudo-lockdown.sh expect-allowed iptables /usr/sbin/iptables -L -n

      - name: Test blocked sudo command is denied
        run: bash scripts/ci/sudo-lockdown.sh expect-denied apt-get /usr/bin/apt-get --version

      - name: Test sudo bash is denied
        run: bash scripts/ci/sudo-lockdown.sh expect-denied "sudo bash" /bin/bash -c "echo pwned"

      - name: Test sudo kill is denied
        run: bash scripts/ci/sudo-lockdown.sh expect-denied "sudo kill" /usr/bin/kill -0 1

      - name: Stop CargoWall and verify cleanup
        run: bash scripts/ci/sudo-lockdown.sh stop-verify

      - name: Verify sudo access restored
        run: bash scripts/ci/sudo-lockdown.sh verify-restored

      - name: Verify runner has full sudo again
        run: bash scripts/ci/sudo-lockdown.sh verify-full-sudo

      - name: Emergency cleanup
        if: always()
        run: bash scripts/ci/sudo-lockdown.sh emergency

  test-sudo-lockdown-full-block:
    name: Integration Test (Sudo Lockdown - Full Block)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      # Step bodies live in scripts/ci/sudo-lockdown.sh; the YAML is wiring.
      - name: Snapshot pre-lockdown sudo state
        run: bash scripts/ci/sudo-lockdown.sh snapshot

      - name: Start CargoWall with sudo lockdown (no allowed commands)
        run: bash scripts/ci/sudo-lockdown.sh start

      - name: Test iptables is denied (no commands allowed)
        run: bash scripts/ci/sudo-lockdown.sh expect-denied iptables /usr/sbin/iptables -L -n

      - name: Test apt-get is denied
        run: bash scripts/ci/sudo-lockdown.sh expect-denied apt-get /usr/bin/apt-get --version

      - name: Test sudo bash is denied
        run: bash scripts/ci/sudo-lockdown.sh expect-denied "sudo bash" /bin/bash -c "echo pwned"

      - name: Stop CargoWall and verify cleanup
        run: bash scripts/ci/sudo-lockdown.sh stop-verify

      - name: Verify sudo access restored
        run: bash scripts/ci/sudo-lockdown.sh verify-restored

      - name: Verify runner has full sudo again
        run: bash scripts/ci/sudo-lockdown.sh verify-full-sudo

      - name: Emergency cleanup
        if: always()
        run: bash scripts/ci/sudo-lockdown.sh emergency

  test-cargowall-gitlab-ci:
    name: Integration Test (GitLab CI mode)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      # Step bodies live in scripts/ci/gitlab-ci.sh; the YAML is wiring.
      - name: Write minimal policy
        run: bash scripts/ci/gitlab-ci.sh policy

      - name: Start CargoWall with --gitlab-ci preset
        run: bash scripts/ci/gitlab-ci.sh start

      - name: Wait for ready via wait-ready subcommand
        run: ./bin/cargowall wait-ready --timeout 30s

      - name: Show startup log (debug aid)
        if: always()
        run: sudo cat /tmp/cargowall.log || true

      - name: Verify systemd-resolved cache flush ran at attach (#89)
        run: bash scripts/ci/gitlab-ci.sh verify-flush

      - name: Verify pidfile written
        run: bash scripts/ci/gitlab-ci.sh verify-pidfile

      - name: Allowed call reaches github.com
        run: bash scripts/ci/gitlab-ci.sh allowed

      - name: Disallowed call still goes through (audit mode logs only)
        run: bash scripts/ci/gitlab-ci.sh disallowed

      - name: DNS query under search-domain suffix is NOT logged as blocked
        run: bash scripts/ci/gitlab-ci.sh dns-bypass

      - name: DNS query NOT covered by rule or search-domain IS logged
        run: bash scripts/ci/gitlab-ci.sh dns-control

      - name: Verify search-domain bypass distinguished from would-deny
        run: bash scripts/ci/gitlab-ci.sh verify-dns-verdicts

      - name: Verify cloud-provider detection ran
        run: bash scripts/ci/gitlab-ci.sh verify-cloud-detect

      - name: Verify auto-allows precede DNS query filtering
        run: bash scripts/ci/gitlab-ci.sh verify-startup-order

      - name: Validate audit log contains would-deny events
        run: bash scripts/ci/gitlab-ci.sh verify-audit

      - name: Stop CargoWall via stop subcommand
        run: bash scripts/ci/gitlab-ci.sh stop

      - name: Verify pidfile removed
        run: bash scripts/ci/gitlab-ci.sh verify-pidfile-removed

      - name: Emergency cleanup
        if: always()
        run: bash scripts/ci/gitlab-ci.sh emergency

  test-cargowall-saas:
    name: Integration Test (SaaS)
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cargowall-binary
          path: bin

      - name: Make binary executable
        run: chmod +x bin/cargowall

      - uses: code-cargo/cargowall-action@78f9fbcb3561c6ad9289e5b740616216e8cbd232 # v1.3.5
        with:
          binary-path: ./bin/cargowall
